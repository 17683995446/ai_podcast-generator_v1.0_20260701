<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目深度分析 · GitHub 播客工具</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/analysis.css">

<!-- Mermaid.js：架构图渲染（dark 主题） -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({startOnLoad: true, theme: 'dark'});
</script>
</head>
<body>

<div id="nav-container"></div>

<div class="container">

  <div class="page-header">
    <div class="section-title" style="margin-top:0;">
      <span class="dot"></span> 项目深度分析
    </div>
    <p class="page-subtitle">基于 zread.ai 风格的项目结构化解读 — 涵盖技术栈、架构设计、关键模块、快速上手与应用场景</p>
  </div>

  <!-- 分析列表容器：由 JS 加载所有期数的分析数据 -->
  <div id="analysisList">
    <div class="empty-state">
      <div class="icon">📭</div>
      <div>暂无分析数据</div>
    </div>
  </div>

</div>

<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/pages/analysis.js"></script>
</body>
</html>
