<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14" id="theme-color-meta">
  <title>概览 · GitHub 播客工具</title>
  <meta name="description" content="自动获取 GitHub 前沿项目并生成深度播客节目，包含项目分析、技术解读和音频内容。">
  <meta name="keywords" content="GitHub, 播客, AI播客, 技术播客, 开源项目分析, 代码解读">
  <meta name="author" content="GitHub 播客工具">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="/">
  <meta property="og:title" content="概览 · GitHub 播客工具">
  <meta property="og:description" content="自动获取 GitHub 前沿项目并生成深度播客节目">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GitHub 播客工具">
  <meta property="og:url" content="/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="概览 · GitHub 播客工具">
  <meta name="twitter:description" content="自动获取 GitHub 前沿项目并生成深度播客节目">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"PodcastSeries","name":"GitHub 播客工具","description":"自动获取 GitHub 前沿项目并生成深度播客节目","url":"/","author":{"@type":"Organization","name":"GitHub 播客工具"}}
  </script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/feed.css">
  <link rel="stylesheet" href="/css/ui-optimizations.css">
</head>
<body class="feed-mode">
  <a href="#main-content" class="skip-link">跳到主内容</a>
  <div id="nav-container"></div>

  <!-- ══ 主内容：抖音式知识卡片信息流 ══ -->
  <main id="main-content">
    <!-- 屏幕阅读器可见的页面标题（视觉隐藏） -->
    <h1 class="sr-only">GitHub 播客工具 · 知识卡片信息流</h1>

    <!-- 信息流容器 -->
    <div id="feedRoot"></div>

    <!-- 浮动生成按钮（FAB） -->
    <div class="fab-generate">
      <button class="fab-btn" id="fabBtn" data-action="toggle-drawer" aria-label="打开生成面板">
        ＋
      </button>
    </div>
  </main>

  <!-- ══ 生成面板抽屉（从底部滑入） ══ -->
  <div class="gen-drawer-overlay" id="genDrawerOverlay"></div>
  <div class="gen-drawer" id="genDrawer" role="dialog" aria-label="生成播客面板" aria-hidden="true">
    <div class="gen-drawer-handle" id="genDrawerHandle" aria-label="拖拽手柄"></div>
    <div class="gen-drawer-header">
      <span class="gen-drawer-title">⚡ 生成播客</span>
      <button class="gen-drawer-close" id="genDrawerClose" aria-label="关闭面板">✕</button>
    </div>
    <div class="gen-drawer-body">
      <!-- 精简统计条 -->
      <div class="drawer-stats-bar" id="drawerStatsBar">
        <div class="drawer-stat-item">
          <div class="drawer-stat-value" id="statEpisodes">—</div>
          <div class="drawer-stat-label">节目</div>
        </div>
        <div class="drawer-stat-item">
          <div class="drawer-stat-value" id="statDuration">—</div>
          <div class="drawer-stat-label">总时长</div>
        </div>
        <div class="drawer-stat-item">
          <div class="drawer-stat-value" id="statChars">—</div>
          <div class="drawer-stat-label">总字数</div>
        </div>
        <div class="drawer-stat-item">
          <div class="drawer-stat-value" id="statSize">—</div>
          <div class="drawer-stat-label">MB</div>
        </div>
      </div>

      <!-- 流水线进度（任务运行时显示） -->
      <div class="pipeline-bar" id="pipelineBar" style="display:none;">
        <div class="pipeline-header">
          <span class="pipeline-title">生成流水线</span>
          <span class="pipeline-status" id="taskLabel"></span>
          <button id="cancelTaskBtn" class="btn-cancel-task" data-action="cancel-task" style="display:none;" aria-label="停止生成任务">⏹ 停止</button>
        </div>
        <div class="stepper" id="stepper">
          <div class="step" data-step="1" data-tooltip="GitHub Trending 发现热门项目"><div class="step-dot">1</div><div class="step-label">发现</div></div>
          <div class="step-line"></div>
          <div class="step" data-step="2" data-tooltip="抓取仓库 README 和元数据"><div class="step-dot">2</div><div class="step-label">抓取</div></div>
          <div class="step-line"></div>
          <div class="step sub" data-step="2.1" data-tooltip="深度提取文件树和源码结构"><div class="step-dot">●</div><div class="step-label">深提取</div></div>
          <div class="step-line"></div>
          <div class="step sub" data-step="2.5" data-tooltip="LLM 分析架构、技术栈和亮点"><div class="step-dot">●</div><div class="step-label">分析</div></div>
          <div class="step-line"></div>
          <div class="step" data-step="3" data-tooltip="LLM 生成播客对话脚本"><div class="step-dot">3</div><div class="step-label">脚本</div></div>
          <div class="step-line"></div>
          <div class="step" data-step="4" data-tooltip="TTS 语音合成音频段落"><div class="step-dot">4</div><div class="step-label">语音</div></div>
          <div class="step-line"></div>
          <div class="step" data-step="5" data-tooltip="音频拼接、归一化和混音"><div class="step-dot">5</div><div class="step-label">混音</div></div>
          <div class="step-line"></div>
          <div class="step" data-step="6" data-tooltip="生成 RSS 并发布到节目库"><div class="step-dot">6</div><div class="step-label">发布</div></div>
        </div>
        <div class="progress-detail" id="progressDetail" style="display:none;"></div>
      </div>

      <!-- 内容来源 -->
      <div class="config-group">
        <div class="config-group-label">内容来源</div>
        <div class="source-tabs" role="tablist" aria-label="内容来源">
          <button class="source-tab active" data-source="auto" data-action="switch-source" role="tab" id="tab-source-auto" aria-selected="true" tabindex="0">🔥 自动发现</button>
          <button class="source-tab" data-source="repos" data-action="switch-source" role="tab" id="tab-source-repos" aria-selected="false" aria-controls="panel-source-repos" tabindex="-1">📦 指定仓库</button>
          <button class="source-tab" data-source="topic" data-action="switch-source" role="tab" id="tab-source-topic" aria-selected="false" aria-controls="panel-source-topic" tabindex="-1">🔍 主题搜索</button>
        </div>
        <div class="source-input" id="sourceRepos" role="tabpanel" aria-labelledby="tab-source-repos" style="display:none;">
          <textarea class="text-input" id="repoUrlsInput" rows="3" placeholder="每行一个 GitHub 仓库 URL&#10;https://github.com/microsoft/vscode&#10;https://github.com/facebook/react" aria-label="仓库 URL 列表"></textarea>
        </div>
        <div class="source-input" id="sourceTopic" role="tabpanel" aria-labelledby="tab-source-topic" style="display:none;">
          <input type="text" class="text-input" id="topicInput" placeholder="输入主题关键词，如：machine learning" aria-label="主题关键词">
        </div>
      </div>

      <!-- 播客风格 -->
      <div class="config-group">
        <div class="config-group-label">播客风格</div>
        <div class="style-tabs" role="group" aria-label="播客风格">
          <button class="style-tab active" data-style="casual" data-action="switch-style" aria-pressed="true">💬 轻松闲聊</button>
          <button class="style-tab" data-style="technical" data-action="switch-style" aria-pressed="false">🔧 技术深度</button>
          <button class="style-tab" data-style="debate" data-action="switch-style" aria-pressed="false">⚡ 辩论对话</button>
          <button class="style-tab" data-style="interview" data-action="switch-style" aria-pressed="false">🎤 访谈风格</button>
        </div>
        <label class="checkbox-wrap longform-toggle">
          <input type="checkbox" id="longformToggle">
          <span>长内容模式（25-40 分钟深度播客）</span>
        </label>
      </div>

      <!-- 单期生成 -->
      <div class="gen-action-section">
        <button class="btn-cta" id="runBtn" data-action="run">
          <span class="btn-cta-icon">▶</span>
          <span>生成一期播客</span>
        </button>
        <div class="gen-meta-row">
          <details class="advanced-toggle">
            <summary>⚙ 高级选项</summary>
            <div class="advanced-body">
              <label class="checkbox-wrap"><input type="checkbox" id="runDry"><span>Dry-Run</span></label>
              <label class="checkbox-wrap"><input type="checkbox" id="runMock"><span>Mock 数据</span></label>
            </div>
          </details>
          <span class="shortcut-hint"><span class="kbd">Ctrl</span>+<span class="kbd">Enter</span></span>
        </div>
      </div>

      <!-- 批量生成 -->
      <div class="gen-action-section secondary">
        <div class="config-group-label">批量生成</div>
        <div class="batch-controls">
          <div class="batch-presets">
            <button class="btn btn-secondary btn-sm" data-action="set-batch-count" data-count="5">5</button>
            <button class="btn btn-secondary btn-sm" data-action="set-batch-count" data-count="10">10</button>
            <button class="btn btn-secondary btn-sm" data-action="set-batch-count" data-count="20">20</button>
            <button class="btn btn-secondary btn-sm" data-action="set-batch-count" data-count="50">50</button>
            <div class="field-inline">
              <input type="number" class="input-sm" id="batchCount" value="5" min="1" max="100" aria-label="批量生成期数">
              <span class="batch-unit">期</span>
            </div>
          </div>
          <button class="btn btn-primary" id="batchBtn" data-action="batch">⚡ 开始批量生成</button>
        </div>
        <details class="advanced-toggle">
          <summary>⚙ 高级选项</summary>
          <div class="advanced-body">
            <label class="checkbox-wrap"><input type="checkbox" id="batchDry"><span>Dry-Run</span></label>
            <label class="checkbox-wrap"><input type="checkbox" id="batchMock"><span>Mock 数据</span></label>
            <label class="checkbox-wrap"><input type="checkbox" id="batchResume"><span>断点续跑</span></label>
          </div>
        </details>
      </div>

      <!-- 运行日志 -->
      <div class="card log-card" style="margin-top:16px;">
        <div class="card-title">
          <span>运行日志</span>
          <span class="log-status-dot" id="logStatusDot"></span>
        </div>
        <div class="log-box" id="logBox" aria-live="polite" aria-label="运行日志">
          <div class="log-empty">暂无日志，点击「生成」按钮开始...</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
