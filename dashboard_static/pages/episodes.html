<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节目库 · GitHub 播客工具</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/episodes.css">
</head>
<body>

<div id="nav-container"></div>

<div class="container">

  <div class="page-header">
    <div class="section-title" style="margin-top:0;">
      <span class="dot"></span> 节目库
      <span id="episodeCount" style="margin-left:auto; font-size:13px; color:var(--text-dim); font-weight:400;"></span>
    </div>
    <p class="page-subtitle">所有已生成的播客节目，支持在线收听、查看脚本和项目深度分析</p>
  </div>

  <div id="episodeList">
    <div class="empty-state">
      <div class="icon">📭</div>
      <div>还没有生成任何节目</div>
    </div>
  </div>

</div>

<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/pages/episodes.js"></script>

</html>
