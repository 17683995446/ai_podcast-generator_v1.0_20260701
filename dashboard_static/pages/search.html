<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索 · GitHub 播客工具</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body>

<div id="nav-container"></div>

<div class="container">

  <div class="page-header">
    <div class="section-title" style="margin-top:0;">
      <span class="dot"></span> 搜索
    </div>
    <p class="page-subtitle">跨所有节目的标题、仓库名和脚本内容进行全文检索</p>
  </div>

  <!-- 搜索框 -->
  <div class="card search-bar-card">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="搜索关键词，如「openpilot」「爬虫」「语音合成」..."
        autocomplete="off"
      >
      <button id="searchClearBtn" class="search-clear-btn" style="display:none;">✕</button>
    </div>
    <!-- 热门搜索建议 -->
    <div class="search-suggestions">
      <span class="suggestion-label">热门：</span>
      <button class="suggestion-chip" data-q="自动驾驶">自动驾驶</button>
      <button class="suggestion-chip" data-q="语音合成">语音合成</button>
      <button class="suggestion-chip" data-q="爬虫">爬虫</button>
      <button class="suggestion-chip" data-q="Rust">Rust</button>
      <button class="suggestion-chip" data-q="开源">开源</button>
    </div>
  </div>

  <!-- 搜索结果 -->
  <div id="searchResults">
    <div class="search-empty-state">
      <span class="icon">🔍</span>
      <div class="title">输入关键词开始搜索</div>
      <div class="desc">搜索范围涵盖节目标题、涉及的 GitHub 仓库名，以及每期播客的完整脚本内容。</div>
    </div>
  </div>

</div>

<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/pages/search.js"></script>
</body>
</html>
