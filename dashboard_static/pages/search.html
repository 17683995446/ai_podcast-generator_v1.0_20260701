<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14" id="theme-color-meta">
<title>搜索 · GitHub 播客工具</title>
<meta name="description" content="全文搜索播客节目内容，快速定位感兴趣的技术话题和项目。">
<meta name="keywords" content="GitHub, 播客, 搜索, 全文搜索, 技术话题">
<meta name="author" content="GitHub 播客工具">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="/search">
<meta property="og:title" content="搜索 · GitHub 播客工具">
<meta property="og:description" content="全文搜索播客节目内容">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GitHub 播客工具">
<meta property="og:url" content="/search">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="搜索 · GitHub 播客工具">
<meta name="twitter:description" content="全文搜索播客节目内容">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/search.css">
<link rel="stylesheet" href="/css/ui-optimizations.css">
</head>
<body>

<a href="#main-content" class="skip-link">跳到主内容</a>
<div id="nav-container"></div>

<main class="container" id="main-content">

  <header class="page-header">
    <h1 class="section-title" style="margin-top:0;">
      <span class="dot"></span> 搜索
    </h1>
    <p class="page-subtitle">跨所有节目的标题、仓库名和脚本内容进行全文检索</p>
  </header>

  <!-- 搜索框 -->
  <div class="card search-bar-card">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        aria-label="搜索关键词"
        placeholder="搜索关键词，如「openpilot」「爬虫」「语音合成」..."
        autocomplete="off"
      >
      <button id="searchClearBtn" class="search-clear-btn" style="display:none;" aria-label="清除搜索">✕</button>
    </div>
    <!-- 热门搜索建议 -->
    <div class="search-suggestions">
      <span class="suggestion-label">热门：</span>
      <button class="suggestion-chip" data-q="自动驾驶">自动驾驶</button>
      <button class="suggestion-chip" data-q="语音合成">语音合成</button>
      <button class="suggestion-chip" data-q="爬虫">爬虫</button>
      <button class="suggestion-chip" data-q="Rust">Rust</button>
      <button class="suggestion-chip" data-q="开源">开源</button>
    </div>
  </div>

  <!-- 搜索结果 -->
  <div id="searchResults" aria-live="polite">
    <div class="search-empty-state">
      <span class="icon">🔍</span>
      <div class="title">输入关键词开始搜索</div>
      <div class="desc">搜索范围涵盖节目标题、涉及的 GitHub 仓库名，以及每期播客的完整脚本内容。</div>
    </div>
  </div>

</main>

<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/pages/search.js"></script>
</body>
</html>
