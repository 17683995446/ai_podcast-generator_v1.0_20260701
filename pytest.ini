[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: 单元测试（隔离测试单个函数/类）
    integration: 集成测试（多模块协作）
    system: 系统测试（端到端流水线）
    slow: 耗时测试（需要网络或大量计算）
filterwarnings =
    ignore::DeprecationWarning
